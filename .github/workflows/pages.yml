name: Validar e publicar painel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar dados e JavaScript
        run: |
          python tests/test_data.py
          node --check assets/app.js
      - name: Preparar arquivos públicos
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets data downloads evidencias _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
